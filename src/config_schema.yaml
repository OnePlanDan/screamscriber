# Configuration options for the Whisper models
model_options:
  engine:
    value: faster-whisper
    type: str
    label: "Inference engine"
    description: "Which engine to use. 'api' calls a remote OpenAI-compatible service. 'faster-whisper' uses CTranslate2 locally (CPU on Mac, GPU on Linux/Win with CUDA). 'mlx' uses Apple's MLX framework for native Apple Silicon GPU + Neural Engine. 'parakeet' runs NVIDIA's Parakeet TDT via MLX on Apple Silicon — much faster than Whisper, 25 European languages with auto-detection."
    options:
      - api
      - faster-whisper
      - mlx
      - parakeet
  use_api:
    value: false
    type: bool
    label: "Connect to API (deprecated — use 'engine' instead)"
    description: "Legacy field. Honored only if 'engine' is unset. Prefer setting 'engine' explicitly."

  # Common configuration options for both API and local models
  common:
    language:
      value: null
      type: str
      description: "The language code for the transcription in ISO-639-1 format."
    temperature:
      value: 0.0
      type: float
      description: "Controls the randomness of the transcription output. Lower values make the output more focused and deterministic."
    initial_prompt:
      value: null
      type: str
      description: "A string used as an initial prompt to condition the transcription. More info: https://platform.openai.com/docs/guides/speech-to-text/prompting"

  # Configuration options for the OpenAI API
  api:
    model:
      value: whisper-1
      type: str
      description: "The model to use for transcription. Currently only 'whisper-1' is available."
    base_url:
      value: https://api.openai.com/v1
      type: str
      description: "The base URL for the API. Can be changed to use a local API endpoint."
    api_key:
      value: null
      type: str
      description: "Your API key for the OpenAI API. Required for non-local API usage."

  # Configuration options for the faster-whisper model
  local:
    model:
      value: base
      type: str
      description: "The model to use for transcription. The larger models provide better accuracy but are slower."
      options:
        - base
        - base.en
        - tiny
        - tiny.en
        - small
        - small.en
        - medium
        - medium.en
        - large
        - large-v1
        - large-v2
        - large-v3
        - large-v3-turbo
        - distil-large-v2
        - distil-large-v3
    device:
      value: auto
      type: str
      description: "The device to run the local Whisper model on. Use 'cuda' for NVIDIA GPUs, 'cpu' for CPU-only processing, or 'auto' to let the system automatically choose the best available device."
      options:
        - auto
        - cuda
        - cpu
    compute_type:
      value: default
      type: str
      description: "The compute type to use for the local Whisper model."
      options:
        - default
        - float32
        - float16
        - int8
    condition_on_previous_text:
      value: true
      type: bool
      description: "Set to true to use the previously transcribed text as a prompt for the next transcription request."
    vad_filter:
      value: false
      type: bool
      description: "Set to true to use a voice activity detection (VAD) filter to remove silence from the recording."
    model_path:
      value: null
      type: str
      description: "The path to the local Whisper model. If not specified, the default model will be downloaded."

  # Configuration options for the mlx-whisper engine (Apple Silicon native)
  mlx:
    model:
      value: mlx-community/whisper-large-v3-turbo
      type: str
      description: "HuggingFace repo for the MLX-converted Whisper model. Other options include 'mlx-community/whisper-large-v3' and 'mlx-community/whisper-medium'."

  # Configuration options for the parakeet-mlx engine (Apple Silicon native)
  parakeet:
    model:
      value: mlx-community/parakeet-tdt-0.6b-v3
      type: str
      description: "HuggingFace repo for the MLX-converted NVIDIA Parakeet model. TDT v3 covers 25 European languages (Swedish included) with automatic language detection. The 'common' options (language, initial_prompt, temperature) are not used by this engine."

# Configuration options for activation and recording
recording_options:
  activation_key:
    value: ctrl+shift+space
    type: str
    description: "The keyboard shortcut to activate the recording and transcribing process. Separate keys with a '+'."
  input_backend:
    value: auto
    type: str
    description: "The input backend to use for detecting key presses. 'auto' will try to use the best available backend."
    options:
      - auto
      - evdev
      - pynput
  recording_mode:
    value: continuous
    type: str
    description: "The recording mode to use. Options include continuous (auto-restart recording after pause in speech until activation key is pressed again), voice_activity_detection (stop recording after pause in speech), press_to_toggle (stop recording when activation key is pressed again), hold_to_record (stop recording when activation key is released)."
    options:
      - continuous
      - voice_activity_detection
      - press_to_toggle
      - hold_to_record
  sound_device:
    value: null
    type: str
    description: "The numeric index of the sound device to use for recording. To find device numbers, run `python -m sounddevice`"
  sample_rate:
    value: 16000
    type: int
    description: "The sample rate in Hz to use for recording."
  silence_duration:
    value: 900
    type: int
    description: "The duration in milliseconds to wait for silence before stopping the recording."
  min_duration:
    value: 100
    type: int
    description: "The minimum duration in milliseconds for a recording to be processed. Recordings shorter than this will be discarded."
  min_speech_duration:
    value: 200
    type: int
    label: "Minimum speech to transcribe (ms)"
    description: "Discard recordings containing less than this many milliseconds of voice-activity-detected speech, instead of letting the model hallucinate on silence ('Thank you.'). Set 0 to disable the check."

# Post-processing options for the transcribed text
post_processing:
  writing_key_press_delay:
    value: 0.005
    type: float
    description: "The delay in seconds between each key press when writing the transcribed text."
  remove_trailing_period:
    value: false
    type: bool
    description: "Set to true to remove the trailing period from the transcribed text."
  add_trailing_space:
    value: true
    type: bool
    description: "Set to true to add a space to the end of the transcribed text."
  remove_capitalization:
    value: false
    type: bool
    description: "Set to true to convert the transcribed text to lowercase."
  input_method:
    value: pynput
    type: str
    description: "The method to use for simulating keyboard input."
    options:
      - pynput
      - ydotool
      - dotool
  focus_policy:
    value: return_to_origin
    type: str
    label: "Where to type when focus changed"
    description: "What to do when another window has taken focus between pressing the record key and typing (macOS only). 'return_to_origin' re-activates the window you started recording in and types there. 'follow_focus' types into whatever is focused now. 'hold_if_changed' types nothing until you refocus the original window yourself (gives up after 60 s; the text stays in the transcription log)."
    options:
      - return_to_origin
      - follow_focus
      - hold_if_changed

# Miscellaneous settings
misc:
  print_to_terminal:
    value: true
    type: bool
    description: "Set to true to print the script status and transcribed text to the terminal."
  hide_status_window:
    value: false
    type: bool
    description: "Set to true to hide the status window during operation."
  noise_on_completion:
    value: false
    type: bool
    description: "Set to true to play a noise after the transcription has been typed out."
  live_preview:
    value: batch
    type: str
    label: "Live transcription preview"
    description: "Show live text in a drawer beneath the status window while recording. 'batch' re-transcribes the whole buffer on an interval with your selected engine (preview matches the final text, but the periodic GPU spikes can cause audible coil whine on some laptops; needs a fast local engine — parakeet or mlx). 'streaming' feeds audio continuously into a Parakeet rolling context (steady light GPU load, no rhythmic whine; preview always uses Parakeet regardless of the selected engine, so wording may differ slightly from the final text)."
    options:
      - "off"
      - batch
      - streaming
  live_preview_interval:
    value: 0.35
    type: float
    label: "Batch preview refresh interval"
    description: "Seconds between re-transcriptions in 'batch' preview mode. Longer intervals mean fewer (but not quieter) GPU spikes and a less lively drawer. Ignored in 'streaming' mode, which paces itself."
  transcription_log:
    value: true
    type: bool
    label: "Transcription log"
    description: "Append every final transcription (timestamp, target app, raw text) to transcription_log.jsonl in the project root. The file is local and gitignored; useful for searching what you have dictated. Held or superseded text is still logged even when it is never typed."

# HTTP API server settings (OpenAI-compatible)
api_server:
  enabled:
    value: false
    type: bool
    label: "Host API server"
    description: "Host an OpenAI-compatible transcription API so other apps or Screamscriber instances can send audio to this machine for transcription."
  port:
    value: 5000
    type: int
    description: "The port number for the HTTP API server."
  host:
    value: "0.0.0.0"
    type: str
    description: "The network interface to listen on. Use 0.0.0.0 to accept connections from other machines, or 127.0.0.1 for localhost only."
  allow_remote_typing:
    value: true
    type: bool
    label: "Allow remote typing endpoint"
    description: "Expose POST /v1/type so external tools can type text at the cursor. Returns 403 when disabled."
  confirm_remote_typing:
    value: true
    type: bool
    label: "Confirm remote typing with countdown"
    description: "When on, show a visible countdown before remote-API typing happens. Press any key during the countdown to abort. Requires the GUI to be running."
  confirm_countdown_seconds:
    value: 3
    type: int
    description: "Seconds the countdown window stays open before typing starts. Set 0 to type immediately without a visible gate."
  confirm_grace_minutes:
    value: 3
    type: int
    description: "After a confirmed remote-typing request, suppress the countdown for this many minutes. Resets on app restart."
  confirm_beep:
    value: false
    type: bool
    label: "Beep when countdown starts"
    description: "Play a short system beep when the remote-typing countdown opens."
