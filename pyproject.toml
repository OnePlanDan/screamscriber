[project]
name = "screamscriber"
version = "0.2.0"
description = "Hold the key. Speak. Text appears."
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyQt5>=5.15",
    "pynput>=1.7.7",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26,<3",
    "PyYAML>=6",
    "openai>=1.50",
    "python-dotenv>=1",
    "webrtcvad-wheels>=2.0.11",
    "audioplayer>=0.6",
]

[project.optional-dependencies]
faster-whisper = [
    "faster-whisper>=1.0",
    "ctranslate2>=4.4",
]
mac = [
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "parakeet-mlx>=0.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
